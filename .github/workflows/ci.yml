# CI: build, lint and test the Go services on every pull request and every
# push to main. The job names are the status checks that branch protection
# requires before a pull request can be merged.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: services/go.mod
      - name: gofmt and go vet
        run: |
          test -z "$(gofmt -l services)" || { echo "Files need gofmt:"; gofmt -l services; exit 1; }
          cd services && go vet ./...
      - name: Build
        run: make build
      - name: Test with race detector and coverage
        run: make cover
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: services/coverage.out

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: services/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: services

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: services/go.mod
      # Built from the Go module proxy, not pulled from Docker Hub, whose
      # unauthenticated rate limit is shared by every GitHub-hosted runner.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: actionlint -color

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # The demo takes about ten seconds; a hung service must not hold the
    # runner for the default six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: services/go.mod
      # shellcheck is preinstalled on the GitHub-hosted Ubuntu runners.
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Run the end-to-end demo
        run: make demo
